name: CI

on:
  workflow_call:
    inputs:
      commit:
        description: Immutable commit to verify (the tag event SHA for releases)
        required: true
        type: string
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
      - run: make check

  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
      - run: go test -race -count=1 -cover ./...
      - run: go -C tools/perfharness test -race -count=1 -cover ./...
      - run: make lint

  windows-safety:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
      - name: Build native Windows executable
        run: go build -o aibris.exe .
      - name: Exercise native Windows commands in an isolated profile
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          $profileRoot = Join-Path $env:RUNNER_TEMP "aibris-windows-profile"
          New-Item -ItemType Directory -Force -Path $profileRoot | Out-Null
          $env:USERPROFILE = $profileRoot
          $env:HOME = $profileRoot
          $env:HOMEDRIVE = [System.IO.Path]::GetPathRoot($profileRoot).TrimEnd('\')
          $env:HOMEPATH = $profileRoot.Substring($env:HOMEDRIVE.Length)
          $env:LOCALAPPDATA = Join-Path $profileRoot ".cache"
          $env:XDG_CACHE_HOME = $env:LOCALAPPDATA
          $env:TEMP = Join-Path $profileRoot "tmp"
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA, $env:TEMP |
            Out-Null

          @(
            "USERPROFILE=$env:USERPROFILE"
            "HOME=$env:HOME"
            "HOMEDRIVE=$env:HOMEDRIVE"
            "HOMEPATH=$env:HOMEPATH"
            "LOCALAPPDATA=$env:LOCALAPPDATA"
            "XDG_CACHE_HOME=$env:XDG_CACHE_HOME"
            "TEMP=$env:TEMP"
            "TMP=$env:TMP"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          .\aibris.exe --version
          .\aibris.exe --help | Out-Null
          .\aibris.exe scan --json |
            Set-Content -Encoding utf8 (Join-Path $profileRoot "scan.json")
          Get-Content -Raw (Join-Path $profileRoot "scan.json") |
            ConvertFrom-Json |
            Out-Null
      - name: Test Windows binary and home-containment contracts
        run: go test -race -count=1 -cover ./test -run '^(TestWindowsCLIContractBinaryCommands|TestWindowsCLIContractRootContainmentAndHomeIsolation|TestCLIContractDestructiveCommandIsolatesWindowsUserCache|TestWindowsScanToDryRunContractPreservesClassification|TestWindowsDryRunPlanJSONMatchesScanReasons)$'
      - name: Test Windows worktree and agent-state reproduction fixtures
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go test -race -count=1 -cover ./test -run '^(TestWindowsLinkedWorktreeFixture|TestWindowsOrphanedWorktreeFixture|TestWindowsPlainDirWorktreeFixture|TestWindowsWorktreeFixtureRequiresGit)$'
          go test -race -count=1 -cover ./test -run '^(TestWindowsClaudeAgentStateFixture|TestWindowsCursorAgentStateFixture|TestWindowsAgentStateCleanupEndToEndUnaudited|TestWindowsRecordedCWDVolumeAmbiguity)$'
      - name: Test PowerShell native installer
        run: go test -race -count=1 -cover ./test -run '^TestNativeInstallPowerShell'
      - name: Test recorded-cwd volume safety
        run: go test -race -count=1 -cover ./internal/adapter -run '^(TestRecordedCWDVolumeIDUsesWindowsVolumePath|TestAgentStateStoreClassifiersRecordedCWDAncestorAvailability|TestBuildCacheAdapter_GoBuild$|TestBuildCacheAdapter_GOCACHEEnv|TestBuildCacheAdapter_GOCACHEOutsideRoots|TestBuildCacheAdapter_GOENVFile)$'
      - name: Test cross-platform CLI contracts
        run: go test -race -count=1 -cover ./test -run '^(TestCLIContractInvalidFlag|TestCLIContractCleanHelpMatchesPolicyVocabulary)$'
      - name: Test platform-safe command and cleanup identity behavior
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go test -race -count=1 -cover ./cmd -run '^(TestCleanCmd_NegativeAge|TestCleanCmd_GuideNoGuideErrors|TestParseAge|TestCleanCmd_InvalidSelector|TestParseCleanSelectorsTrimAndDeduplicate)$'
      - name: Test effective GOCACHE cleanup safety
        run: go test -race -count=1 -cover ./internal/cleaner -run '^TestIsSafeTarget_GoBuildCacheUnderHome$'
      - name: Test restored cleaner command authority and execution contracts
        run: go test -race -count=1 -cover ./internal/cleaner -run '^(TestExecuteRefusesUntrustedCleanupRecipes|TestExecuteRevalidatesCommandAndFallbackAuthorityAtBarrier|TestExecuteCommandFailurePreservesOutsideSentinel|TestExecute_CommandCleanupZeroReclaimWhenOwnerRemains|TestExecute_PressureUvForceLeavesResidualWithoutInventingFreedBytes|TestExecute_PressureUvForceRejectionReportsResidualWithoutInventingFreedBytes|TestExecute_CommandCleanupSuccess|TestExecute_CommandMissingFallsBackToPathRemoval|TestExecute_CommandFailureDoesNotFallback|TestExecute_CommandCancellationDoesNotCreditRemainingPayload|TestExecute_CommandCancellation|TestUvCleanupDoesNotRunInsideCacheRoot|TestGoCleanupOnlyRemovesPreviewedCache|TestNpmCleanupOnlyRemovesPreviewedCache)$'
      # Run whole packages so new deletion-gate tests are included automatically.
      # Symlink fixtures skip only if Windows lacks symlink privilege; their
      # t.Skipf messages report that reason. No test-name exclusions here.
      - name: Test deletion gate, path identity, and HOME hermeticity
        run: go test -race -count=1 -cover ./internal/safedelete ./internal/pathidentity ./internal/testutil
      - name: Test HOME hermeticity under isolated profile
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          go test -race -count=1 -cover ./cmd -run '^TestAgentStateEntryFingerprintTracksEntrySet$'
          go test -race -count=1 -cover ./internal/scanner -run '^(TestScan_Default|TestNormalizeRoots_DefaultHome)$'
      - name: Test nested perfharness module environment
        run: go -C tools/perfharness test -race -count=1 -cover ./...
      - run: go vet ./...

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ inputs.commit || github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
      - name: Cross-compile release targets
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: build --snapshot --clean
