name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: go test -race -count=1 -cover ./...
      - run: go vet ./...

  windows-safety:
    permissions:
      contents: read
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Build native Windows executable
        run: go build -o aibris.exe .
      - name: Exercise native Windows commands in an isolated profile
        run: |
          $profileRoot = Join-Path $env:RUNNER_TEMP "aibris-windows-profile"
          New-Item -ItemType Directory -Force -Path $profileRoot | Out-Null
          $env:USERPROFILE = $profileRoot
          $env:HOME = $profileRoot
          $env:HOMEDRIVE = [System.IO.Path]::GetPathRoot($profileRoot).TrimEnd('\')
          $env:HOMEPATH = $profileRoot.Substring($env:HOMEDRIVE.Length)
          $env:LOCALAPPDATA = Join-Path $profileRoot ".cache"
          $env:XDG_CACHE_HOME = $env:LOCALAPPDATA
          $env:TEMP = Join-Path $profileRoot "tmp"
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:LOCALAPPDATA, $env:TEMP |
            Out-Null

          @(
            "USERPROFILE=$env:USERPROFILE"
            "HOME=$env:HOME"
            "HOMEDRIVE=$env:HOMEDRIVE"
            "HOMEPATH=$env:HOMEPATH"
            "LOCALAPPDATA=$env:LOCALAPPDATA"
            "XDG_CACHE_HOME=$env:XDG_CACHE_HOME"
            "TEMP=$env:TEMP"
            "TMP=$env:TMP"
          ) | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          .\aibris.exe --version
          .\aibris.exe --help | Out-Null
          .\aibris.exe scan --json |
            Set-Content -Encoding utf8 (Join-Path $profileRoot "scan.json")
          Get-Content -Raw (Join-Path $profileRoot "scan.json") |
            ConvertFrom-Json |
            Out-Null
      - name: Test Windows binary and home-containment contracts
        run: go test -race -count=1 -cover . -run '^(TestWindowsCLIContractBinaryCommands|TestWindowsCLIContractRootContainmentAndHomeIsolation|TestCLIContractDestructiveCommandIsolatesWindowsUserCache)$'
      - name: Test recorded-cwd volume safety
        run: go test -race -count=1 -cover ./internal/adapter -run '^(TestRecordedCWDVolumeIDUsesWindowsVolumePath|TestAgentStateStoreClassifiersRecordedCWDAncestorAvailability)$'
      - name: Test cross-platform CLI contracts
        run: go test -race -count=1 -cover . -run '^(TestCLIContractInvalidFlag|TestCLIContractCleanHelpMatchesPolicyVocabulary)$'
      - name: Test platform-safe command and cleanup identity behavior
        run: go test -race -count=1 -cover ./cmd -run '^(TestWindowsCleanupPathIdentityRejectsReparsePoint|TestCleanCmd_NegativeAge|TestCleanCmd_GuideNoGuideErrors|TestParseAge|TestCleanCmd_InvalidSelector|TestParseCleanSelectorsTrimAndDeduplicate)$'
      - name: Test HOME hermeticity under isolated profile
        run: |
          go test -race -count=1 -cover ./internal/testutil -run '^(TestSetHomeRedirectsUserHomeDir|TestSetHomeRedirectsUserCacheDir|TestSetHomePreservesVolumeShape)$'
          go test -race -count=1 -cover ./cmd -run '^TestAgentStateEntryFingerprintTracksEntrySet$'
          go test -race -count=1 -cover ./internal/scanner -run '^(TestScan_Default|TestNormalizeRoots_DefaultHome)$'
      - name: Test nested perfharness module environment
        run: go -C tools/perfharness test -race -count=1 -cover ./...
      - run: go vet ./...

  release-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Cross-compile release targets
        uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: build --snapshot --clean
