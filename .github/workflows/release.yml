name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Validate curated Windows release status
        env:
          RELEASE_NOTES: .github/release-notes/${{ github.ref_name }}.md
        run: |
          .github/scripts/validate-windows-release-status.sh "$RELEASE_NOTES"
      - name: Require tap-only token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN must be set so a failed tap commit fails the release." >&2
            exit 1
          fi
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --release-notes .github/release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}

  brew-pour:
    needs: goreleaser
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Pour tap formula and assert version
        run: .github/scripts/pour-homebrew-formula.sh "${GITHUB_REF_NAME}"
