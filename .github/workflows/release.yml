name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  # Re-run every required CI job on this tag event's immutable commit. No
  # branch-status lookup can authorize publication of a different SHA.
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      commit: ${{ github.sha }}
    permissions:
      contents: read

  goreleaser:
    # Default needs-success blocks failed, cancelled, or skipped verification.
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # id-token/attestations are required only by attest-build-provenance (#121).
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.sha }}
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: "1.26.9"
      - name: Validate curated Windows release status
        env:
          RELEASE_NOTES: .github/release-notes/${{ github.ref_name }}.md
        run: |
          .github/scripts/validate-windows-release-status.sh "$RELEASE_NOTES"
      - name: Require tap-only token
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "${HOMEBREW_TAP_TOKEN}" ]; then
            echo "HOMEBREW_TAP_TOKEN must be the tap deploy-key private key so a failed tap commit fails the release." >&2
            exit 1
          fi
      - name: Install syft for GoReleaser SBOM generation
        uses: anchore/sbom-action/download-syft@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          syft-version: "v1.54.1"
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: "v2.18.2"
          args: release --clean --release-notes .github/release-notes/${{ github.ref_name }}.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      # Runs in the same job as goreleaser: a failed attestation fails the
      # release job, so no release is treated as trusted and brew-pour never
      # runs. Do not mark this step as optional (#121).
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
      # GoReleaser created a draft. Publish only after provenance succeeds so
      # a failed attestation cannot leave a public unattested release.
      - name: Publish attested release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
      # Tap commit happens only after the GitHub release is public so a
      # failed attestation cannot leave brew pointing at draft 404s (#294).
      - name: Publish Homebrew formula
        env:
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: .github/scripts/publish-homebrew-formula.sh

  brew-pour:
    needs: [verify, goreleaser]
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Pour tap formula and assert version
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: .github/scripts/pour-homebrew-formula.sh "${GITHUB_REF_NAME}"
